<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin sign in — InterviewCoach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6ec; --paper: #fffdf8; --sunk: #f4eedf; --border: #e8dfca; --border2: #d9cdb0;
    --text: #2a2620; --muted: #6f6858; --faint: #a19883;
    --accent: #33449c; --accent-soft: #e9ebf8;
    --red: #b4433a; --red-soft: #f8e6e2;
    --radius: 16px;
    --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --shadow: 0 1px 2px rgba(74,58,20,.05), 0 16px 48px rgba(74,58,20,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top-link { position: absolute; top: 22px; left: 24px; color: var(--muted); text-decoration: none; font-size: 13.5px; font-weight: 500; border: 1px solid var(--border2); background: var(--paper); padding: 8px 16px; border-radius: 999px; transition: color .15s, border-color .15s; }
  .top-link:hover { color: var(--accent); border-color: var(--accent); }

  .box { width: 100%; max-width: 440px; background: var(--paper); border: 1px solid var(--border); border-radius: 20px; padding: 36px 34px 30px; box-shadow: var(--shadow); }
  .logo { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 19px; margin-bottom: 18px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; letter-spacing: -.02em; line-height: 1.1; }
  .box > p { color: var(--muted); font-size: 14.5px; margin: 8px 0 22px; }

  .tabs { display: flex; gap: 8px; background: var(--sunk); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 6px; }
  .tabs button { flex: 1; padding: 9px; border-radius: 9px; border: none; background: transparent; color: var(--muted); font: 600 13.5px var(--font); cursor: pointer; transition: background .15s, color .15s; }
  .tabs button.on { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(74,58,20,.12); }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin: 14px 0 6px; }
  input { width: 100%; padding: 11px 14px; font-size: 14.5px; border: 1px solid var(--border2); border-radius: 11px; background: #fff; color: var(--text); font-family: var(--font); transition: border-color .15s, box-shadow .15s; }
  input::placeholder { color: var(--faint); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .err { display: none; margin-top: 14px; font-size: 13.5px; color: var(--red); background: var(--red-soft); border: 1px solid #ecc6c0; padding: 10px 13px; border-radius: 11px; }

  button.go { width: 100%; margin-top: 20px; padding: 13px; border: none; border-radius: 12px; font: 600 14.5px var(--font); cursor: pointer; background: var(--accent); color: #fff; transition: background .15s, transform .1s; }
  button.go:hover { background: #2a397f; }
  button.go:active { transform: translateY(1px); }
  button.go:disabled { opacity: .6; cursor: wait; }

  .fine { margin-top: 16px; text-align: center; font-size: 12.5px; color: var(--faint); }
  .back { display: block; text-align: center; margin-top: 18px; color: var(--muted); font-size: 13.5px; font-weight: 500; text-decoration: none; }
  .back:hover { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<a class="top-link" href="/">← Careers site</a>
<div class="box">
  <div class="logo">◉</div>
  <h1>Hiring dashboard</h1>
  <p>Sign in to create roles, draft question banks and share interview links.</p>
  <div class="tabs">
    <button id="tab-login" class="on" type="button">Sign in</button>
    <button id="tab-signup" type="button">Create account</button>
  </div>
  <div id="name-row" style="display:none">
    <label for="name">Your name</label>
    <input id="name" placeholder="Ada Lovelace" autocomplete="name">
  </div>
  <label for="email">Work email</label>
  <input id="email" type="email" placeholder="you@company.com" autocomplete="email">
  <label for="password">Password <span style="font-weight:400;color:var(--faint)">min 8 characters</span></label>
  <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button class="go" id="go">Sign in →</button>
  <p class="fine">Anyone with this link can create an account and run their own hiring dashboard.</p>
  <a class="back" href="/">← Back to open roles</a>
</div>
<script>
let mode = 'login';
const $ = (id) => document.getElementById(id);
function setMode(m){
  mode = m;
  $('tab-login').classList.toggle('on', m==='login');
  $('tab-signup').classList.toggle('on', m==='signup');
  $('name-row').style.display = m==='signup' ? 'block' : 'none';
  $('go').textContent = m==='signup' ? 'Create account →' : 'Sign in →';
  hideErr();
}
$('tab-login').onclick = () => setMode('login');
$('tab-signup').onclick = () => setMode('signup');
function showErr(m){ const e=$('err'); e.textContent=m; e.style.display='block'; }
function hideErr(){ $('err').style.display='none'; }
$('go').onclick = async () => {
  hideErr();
  const body = { email: $('email').value.trim(), password: $('password').value, name: $('name').value.trim() };
  if (!body.email || !body.password) { showErr('Enter your email and password.'); return; }
  $('go').disabled = true;
  try {
    const res = await fetch('/api/auth/' + mode, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data.error || ('HTTP '+res.status));
    location.href = '/admin';
  } catch(e){ showErr(e.message); }
  $('go').disabled = false;
};
document.addEventListener('keydown', (e)=>{ if(e.key==='Enter') $('go').click(); });
// If already signed in, skip
fetch('/api/auth/me').then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.user) location.href='/admin'; }).catch(()=>{});
</script>
</body>
</html>
